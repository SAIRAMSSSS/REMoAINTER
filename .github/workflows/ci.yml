name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · check + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Code formatting check (rustfmt)
        working-directory: rust
        run: cargo fmt --check

      - name: Linter check (clippy)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Check (release profile)
        working-directory: rust
        run: cargo check --release

      - name: Test suite (all targets)
        working-directory: rust
        run: cargo test --release --all-targets
