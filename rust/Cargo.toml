[package]
name = "remoainter"
version = "2.0.0"
edition = "2021"
authors = ["REMoAINTER Team"]
description = "Next-Gen Open-Source 3D PBR Texture Painting Suite (Substance Painter Architecture in Rust)"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tobj = { version = "4.0", default-features = false }
chrono = "0.4"
