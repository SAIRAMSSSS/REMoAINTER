[package]
name = "remoainter"
version = "2.0.0"
edition = "2021"
authors = ["REMoAINTER Team"]
description = "Next-Gen Open-Source 3D PBR Texture Painting Suite (Substance Painter Architecture in Rust)"
license = "MIT OR Apache-2.0"

[lib]
name = "remoainter"
path = "src/lib.rs"

[[bin]]
name = "remoainter"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.29"
glam = "0.29"
ash = { version = "0.38", default-features = false, features = ["loaded"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tga"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tobj = { version = "4.0", default-features = false }
chrono = "0.4"
exr = "1.74.2"
rfd = "0.17.2"
egui-wgpu = "0.29"
bytemuck = { version = "1.25", features = ["derive"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
gltf = "1.4.1"
ab_glyph = "0.2"
ufbx = "0.11"
sevenz-rust = { version = "0.6", default-features = false, features = ["compress"] }
quick-xml = "0.36"
wgpu = "22.1"
